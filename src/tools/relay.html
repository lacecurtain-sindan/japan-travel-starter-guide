<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Upload relay</title>
<style>body{font-family:system-ui,sans-serif;padding:24px;max-width:560px;margin:auto}button{font-size:18px;padding:14px 20px;border-radius:999px;border:0;background:#d32f2f;color:#fff;cursor:pointer}#log{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;background:#f5f5f5;padding:12px;margin-top:16px}</style>
</head><body>
<h1>Upload relay</h1>
<p>Opens TikTok Studio and hands over the files listed in this page's address.</p>
<button id="go" type="button">Open TikTok upload</button>
<div id="log"></div>
<script>
const params = new URLSearchParams(location.search);
const files = (params.get('files') || '').split(',').filter(Boolean);
const target = 'https://www.tiktok.com';
const log = m => { document.getElementById('log').textContent += m + '\n'; };
log('Files: ' + (files.join(', ') || '(none)'));
let win = null, sent = false;
document.getElementById('go').addEventListener('click', () => {
  win = window.open(target + '/tiktokstudio/upload?from=webapp', 'tiktok_upload');
  log(win ? 'Opened TikTok window' : 'Popup blocked');
  const t = setInterval(() => {
    if (!win || win.closed) { log('Window closed or not reachable'); clearInterval(t); return; }
    if (!sent) win.postMessage({relay: 'ping'}, target);
  }, 1500);
});
window.addEventListener('message', async e => {
  if (e.origin !== target || !e.data || e.data.relay !== 'ready' || sent) return;
  sent = true;
  log('TikTok listener ready, sending ' + files.length + ' file(s)');
  const payload = [];
  for (const f of files) {
    const r = await fetch(f);
    const buf = await r.arrayBuffer();
    payload.push({name: f.split('/').pop(), type: r.headers.get('content-type') || 'application/octet-stream', buf});
  }
  e.source.postMessage({relay: 'files', files: payload}, target, payload.map(p => p.buf));
  log('Sent');
});
</script>
</body></html>
